name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  # CMake 4.0 removed compatibility with `cmake_minimum_required(VERSION < 3.5)`.
  # Several zvec thirdparty deps (lz4, arrow, …) still declare such low minimums,
  # and their ExternalProject sub-configures do NOT inherit the `-D` flag we pass
  # to the top-level configure. Set it in the environment so every nested cmake
  # invocation picks it up. Harmless on CMake 3.x runners (env var is 4.0+ only).
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  smoke-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Run raw bindings example
        run: cargo run -p zvec --example basic

      - name: Test safe wrapper crate
        run: cargo test -p zvec-rs --all-features

  android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Android NDK
        uses: android-actions/setup-android@v3
        with:
          packages: "ndk;26.1.10909125"

      - name: Set ANDROID_NDK_HOME
        run: echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Add Rust Android target
        run: rustup target add aarch64-linux-android

      - name: Configure Android linker
        run: |
          mkdir -p .cargo
          LINKER="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang"
          printf '[target.aarch64-linux-android]\nlinker = "%s"\n' "$LINKER" > .cargo/config.toml

      - name: Build for Android
        run: |
          export BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android="--sysroot=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          cargo build -p zvec --target aarch64-linux-android --example basic

  # Build the zvec C API from upstream source for targets where we need
  # release-asset confidence before a release is cut.
  android_x86_64:
    runs-on: ubuntu-latest
    env:
      ZVEC_REPO: alibaba/zvec
      ZVEC_REV: v0.5.0

    steps:
      - uses: actions/checkout@v6

      # The C API build is deterministic for a pinned ZVEC_REV (same source,
      # same toolchain flags), so cache the built lib and skip the ~20 min
      # from-source CMake build entirely on a hit. The workflow-file hash in
      # the key invalidates the cache whenever the build recipe changes.
      - name: Cache zvec C API build
        id: zvec-cache
        uses: actions/cache@v4
        with:
          path: _zvec/build/lib
          key: zvec-capi-x86_64-linux-android-${{ env.ZVEC_REV }}-${{ hashFiles('.github/workflows/ci.yml') }}

      - name: Checkout zvec
        if: steps.zvec-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v6
        with:
          repository: ${{ env.ZVEC_REPO }}
          ref: ${{ env.ZVEC_REV }}
          path: _zvec
          submodules: recursive

      - name: Install Ninja
        if: steps.zvec-cache.outputs.cache-hit != 'true'
        uses: seanmiddleditch/gha-setup-ninja@v6

      # NDK stays unconditional: the cargo build below needs its linker and
      # bindgen sysroot even on a cache hit.
      - name: Setup Android NDK
        uses: android-actions/setup-android@v3
        with:
          packages: "ndk;26.1.10909125"

      - name: Set ANDROID_NDK_HOME
        run: echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Add Rust Android target
        run: rustup target add x86_64-linux-android

      - name: Patch zvec Android aligned allocation
        if: steps.zvec-cache.outputs.cache-hit != 'true'
        run: bash scripts/patch-zvec-android.sh _zvec

      - name: Build host protoc
        if: steps.zvec-cache.outputs.cache-hit != 'true'
        run: |
          cp -r _zvec _zvec-host
          cmake -S _zvec-host -B _zvec-host/build -G Ninja -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build _zvec-host/build --target protoc --parallel

      - name: Build zvec C API for x86_64 Android
        if: steps.zvec-cache.outputs.cache-hit != 'true'
        run: |
          cmake -S _zvec -B _zvec/build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=x86_64 \
            -DANDROID_PLATFORM=android-21 \
            -DANDROID_STL=c++_static \
            -DENABLE_NATIVE=OFF \
            -DAUTO_DETECT_ARCH=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DBUILD_C_BINDINGS=ON \
            -DBUILD_PYTHON_BINDINGS=OFF \
            -DBUILD_TOOLS=OFF \
            -DGLOBAL_CC_PROTOBUF_PROTOC="$GITHUB_WORKSPACE/_zvec-host/build/bin/protoc"
          cmake --build _zvec/build --target zvec_c_api --parallel "$(nproc)"

      - name: Configure Android linker
        run: |
          mkdir -p .cargo
          LINKER="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android21-clang"
          printf '[target.x86_64-linux-android]\nlinker = "%s"\n' "$LINKER" > .cargo/config.toml

      - name: Build Rust bindings for x86_64 Android
        run: |
          export BINDGEN_EXTRA_CLANG_ARGS_x86_64_linux_android="--sysroot=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          ZVEC_LIB_DIR="$GITHUB_WORKSPACE/_zvec/build/lib" cargo build -p zvec --target x86_64-linux-android --example basic --locked

      # Publish the freshly built lib so it can be consumed before a release
      # exists (e.g. wiring into a downstream build via ZVEC_LIB_DIR).
      - name: Package x86_64 Android artifact
        run: |
          mkdir -p staging
          cp _zvec/build/lib/libzvec_c_api.so staging/
          tar -czf zvec_c_api-x86_64-linux-android.tar.gz -C staging .
          test -s zvec_c_api-x86_64-linux-android.tar.gz

      - name: Upload x86_64 Android artifact
        uses: actions/upload-artifact@v7
        with:
          name: zvec_c_api-x86_64-linux-android
          path: zvec_c_api-x86_64-linux-android.tar.gz

  # Device and simulator build in PARALLEL matrix legs (they were serial in
  # one job, ~34 min cold), each behind a build-output cache (deterministic
  # for a pinned ZVEC_REV — warm runs skip the from-source CMake build
  # entirely). The `ios` job below aggregates them so the branch-protection
  # required-check context "ios" is unchanged.
  ios-build:
    # Pinned to macos-15 (Xcode 16.x): the macos-latest migration to
    # macos-26 / Xcode 26.5 broke Apache Arrow 21.0.0's iOS cross-compile
    # configure (this job was green on macos-15-arm64 through 2026-06-22 and
    # started failing only on the macos-26-arm64 image). Revisit once Arrow's
    # iOS build supports Xcode 26.x.
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: device
            sdk: iphoneos
            rust-target: aarch64-apple-ios
          - variant: simulator
            sdk: iphonesimulator
            rust-target: aarch64-apple-ios-sim
    name: ios-build (${{ matrix.variant }})
    env:
      ZVEC_REPO: alibaba/zvec
      ZVEC_REV: v0.5.0

    steps:
      - uses: actions/checkout@v6

      - name: Cache zvec C API build
        id: zvec-cache
        uses: actions/cache@v4
        with:
          path: _zvec/build/lib
          key: zvec-capi-${{ matrix.rust-target }}-${{ env.ZVEC_REV }}-${{ hashFiles('.github/workflows/ci.yml') }}

      - name: Checkout zvec
        if: steps.zvec-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v6
        with:
          repository: ${{ env.ZVEC_REPO }}
          ref: ${{ env.ZVEC_REV }}
          path: _zvec
          submodules: recursive

      - name: Install Ninja
        if: steps.zvec-cache.outputs.cache-hit != 'true'
        uses: seanmiddleditch/gha-setup-ninja@v6

      - name: Patch zvec iOS static library names
        if: steps.zvec-cache.outputs.cache-hit != 'true'
        run: |
          perl -0pi -e 's/if\(NOT MSVC\)\n    set_property\(TARGET \$\{_NAME\}_static PROPERTY OUTPUT_NAME \$\{_NAME\}\)\n  endif\(\)/if(NOT MSVC AND NOT IOS)\n    set_property(TARGET \${_NAME}_static PROPERTY OUTPUT_NAME \${_NAME})\n  endif()/g' _zvec/cmake/bazel.cmake
          grep -q 'if(NOT MSVC AND NOT IOS)' _zvec/cmake/bazel.cmake

      - name: Add Rust iOS target
        run: rustup target add ${{ matrix.rust-target }}

      - name: Build host protoc
        if: steps.zvec-cache.outputs.cache-hit != 'true'
        run: |
          cp -r _zvec _zvec-host
          cmake -S _zvec-host -B _zvec-host/build -G Ninja -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build _zvec-host/build --target protoc --parallel

      # Device vs simulator differ only by SDK sysroot — that is what stamps
      # the dylib's platform (a device dylib will not link into a simulator
      # app and vice versa).
      - name: Build zvec C API (${{ matrix.sdk }})
        if: steps.zvec-cache.outputs.cache-hit != 'true'
        run: |
          SDK_PATH=$(xcrun --sdk ${{ matrix.sdk }} --show-sdk-path)
          NPROC=$(sysctl -n hw.ncpu)
          cmake -S _zvec -B _zvec/build -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_SYSROOT="$SDK_PATH" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DBUILD_C_BINDINGS=ON \
            -DBUILD_PYTHON_BINDINGS=OFF \
            -DBUILD_TOOLS=OFF \
            -DGLOBAL_CC_PROTOBUF_PROTOC="$GITHUB_WORKSPACE/_zvec-host/build/bin/protoc" \
            -DIOS=ON
          cmake --build _zvec/build --target zvec_c_api --parallel "$NPROC"

      # For the simulator leg this exercises the build.rs sim paths: the
      # CARGO_CFG_TARGET_ABI == "sim" branch in target_triple(),
      # apple_sdk_path resolving the iphonesimulator SDK, and the bindgen
      # --target/--sysroot override (without which bindgen rejects the -sim
      # triple).
      - name: Check Rust bindings (${{ matrix.rust-target }})
        run: ZVEC_LIB_DIR="$GITHUB_WORKSPACE/_zvec/build/lib" cargo check -p zvec --target ${{ matrix.rust-target }} --locked

      - name: Package iOS artifact smoke
        if: matrix.variant == 'device'
        run: |
          mkdir -p staging
          cp _zvec/build/lib/libzvec_c_api.dylib staging/
          tar -czf zvec_c_api-aarch64-apple-ios.tar.gz -C staging .
          test -s zvec_c_api-aarch64-apple-ios.tar.gz

  # Aggregator preserving the branch-protection required-check context "ios"
  # across the matrix split above. `if: always()` + explicit result check:
  # a skipped/failed leg must fail this job, never skip it.
  ios:
    runs-on: ubuntu-latest
    needs: ios-build
    if: always()
    steps:
      - name: All iOS legs green
        run: |
          result="${{ needs.ios-build.result }}"
          echo "ios-build matrix result: $result"
          [ "$result" = "success" ]
