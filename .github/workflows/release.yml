name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump level"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  pull-requests: write

env:
  ZVEC_REPO: alibaba/zvec
  ZVEC_REV: v0.5.0
  # CMake 4.0 removed compatibility with `cmake_minimum_required(VERSION < 3.5)`.
  # Several zvec thirdparty deps (lz4, arrow, …) still declare such low minimums,
  # and their ExternalProject sub-configures do NOT inherit the `-D` flag we pass
  # to the top-level configure. Set it in the environment so every nested cmake
  # invocation picks it up. Harmless on CMake 3.x runners (env var is 4.0+ only).
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"
  # MUST stay identical to ci.yml's ZVEC_CACHE_VERSION — the two workflows
  # share cache keys so releases reuse the C API builds CI keeps warm. Bump
  # BOTH together whenever any C-build flag, patch script, or toolchain pin
  # changes.
  ZVEC_CACHE_VERSION: "v3"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      zvec_sha: ${{ steps.zvec-sha.outputs.sha }}
      version: ${{ steps.next-version.outputs.version }}
    steps:
      - name: Checkout zvec-rs
        uses: actions/checkout@v7

      - name: Checkout zvec
        uses: actions/checkout@v7
        with:
          repository: ${{ env.ZVEC_REPO }}
          ref: ${{ env.ZVEC_REV }}
          path: _zvec

      - name: Get zvec commit SHA
        id: zvec-sha
        run: echo "sha=$(git -C _zvec rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Compute next version
        id: next-version
        run: |
          CURRENT=$(cargo metadata --manifest-path Cargo.toml --format-version 1 --no-deps | jq -r '.packages[] | select(.name == "zvec") | .version')
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          case "${{ inputs.bump }}" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac
          echo "version=${MAJOR}.${MINOR}.${PATCH}" >> "$GITHUB_OUTPUT"

      - name: Upload header
        uses: actions/upload-artifact@v7
        with:
          name: zvec-header
          path: _zvec/src/include/zvec/c_api.h

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            cmake_extra: ""
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            cmake_extra: ""
          - target: x86_64-apple-darwin
            os: macos-15-intel
            cmake_extra: "-DENABLE_NATIVE=OFF -DCMAKE_CXX_FLAGS=-march=x86-64-v2 -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0"
          # NOTE: native macOS Arrow builds apply zvec's arrow.patch, which
          # already carries the loosened libtool-version regex — the
          # Xcode-26.5 break only ever affected arrow.ios.patch (see the
          # port step below).
          - target: aarch64-apple-darwin
            os: macos-latest
            cmake_extra: "-DCMAKE_OSX_DEPLOYMENT_TARGET=11.0"
          # Un-pinned from macos-15 (2026-07-10): the Xcode 26.5 Arrow-iOS
          # configure break is fixed by the "Port zvec's libtool-regex fix"
          # step below (see the ci.yml ios-build job note for the root cause).
          - target: aarch64-apple-ios
            os: macos-latest
            cmake_extra: "-DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 -DCMAKE_OSX_ARCHITECTURES=arm64 -DIOS=ON"
          - target: aarch64-apple-ios-sim
            os: macos-latest
            cmake_extra: "-DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 -DCMAKE_OSX_ARCHITECTURES=arm64 -DIOS=ON"
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            cmake_extra: ""
          - target: aarch64-linux-android
            os: ubuntu-latest
            cmake_extra: "-DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-21 -DANDROID_STL=c++_static -DENABLE_NATIVE=OFF -DAUTO_DETECT_ARCH=OFF"
          - target: x86_64-linux-android
            os: ubuntu-latest
            cmake_extra: "-DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake -DANDROID_ABI=x86_64 -DANDROID_PLATFORM=android-21 -DANDROID_STL=c++_static -DENABLE_NATIVE=OFF -DAUTO_DETECT_ARCH=OFF"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout zvec-rs
        uses: actions/checkout@v7

      # SAME key format as ci.yml's from-source jobs, so a release dispatch
      # reuses the caches CI keeps warm: for the targets CI also builds
      # (iOS device/sim, x86_64 android) the ~20-40 min from-source build
      # collapses to a cache restore. The build is deterministic for a
      # pinned ZVEC_REV; bump ZVEC_CACHE_VERSION on any recipe change.
      - name: Cache zvec C API build
        id: zvec-cache
        uses: actions/cache@v6
        with:
          path: |
            _zvec/build/lib
            _zvec/build/bin
          key: zvec-capi-${{ matrix.target }}-${{ env.ZVEC_REV }}-${{ env.ZVEC_CACHE_VERSION }}

      - name: Checkout zvec
        if: steps.zvec-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v7
        with:
          repository: ${{ env.ZVEC_REPO }}
          ref: ${{ env.ZVEC_REV }}
          path: _zvec
          submodules: recursive

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows' && steps.zvec-cache.outputs.cache-hit != 'true'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja
        if: steps.zvec-cache.outputs.cache-hit != 'true'
        shell: bash
        # Native package managers instead of gha-setup-ninja: that action
        # flakes on corrupt zip downloads ("Invalid or unsupported zip
        # format", seen live 2026-07-09) and its runtime targets deprecated
        # Node 20. brew/apt/choco are preinstalled on all GitHub runners.
        run: |
          case "$RUNNER_OS" in
            macOS) brew install ninja ;;
            Linux) sudo apt-get install -y ninja-build || { sudo apt-get update && sudo apt-get install -y ninja-build; } ;;
            Windows) choco install ninja -y ;;
          esac

      - name: Install Linux native dependencies
        if: runner.os == 'Linux' && !contains(matrix.target, 'android') && steps.zvec-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libaio-dev

      # Same fix as ci.yml's ios-build job — see the comment there for the
      # full root cause (Xcode 26.5 renamed libtool's version string; zvec's
      # arrow.ios.patch is missing the loosened-regex hunk that its
      # arrow.patch already has).
      - name: Port zvec's libtool-regex fix into arrow.ios.patch
        if: startsWith(matrix.target, 'aarch64-apple-ios') && steps.zvec-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          sed -n '1,13p' _zvec/thirdparty/arrow/arrow.patch >> _zvec/thirdparty/arrow/arrow.ios.patch
          grep -qF 'cctools[-_a-z]*' _zvec/thirdparty/arrow/arrow.ios.patch

      - name: Patch zvec iOS static library names
        if: startsWith(matrix.target, 'aarch64-apple-ios') && steps.zvec-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          perl -0pi -e 's/if\(NOT MSVC\)\n    set_property\(TARGET \$\{_NAME\}_static PROPERTY OUTPUT_NAME \$\{_NAME\}\)\n  endif\(\)/if(NOT MSVC AND NOT IOS)\n    set_property(TARGET \${_NAME}_static PROPERTY OUTPUT_NAME \${_NAME})\n  endif()/g' _zvec/cmake/bazel.cmake
          grep -q 'if(NOT MSVC AND NOT IOS)' _zvec/cmake/bazel.cmake

      - name: Setup Android NDK
        if: contains(matrix.target, 'android') && steps.zvec-cache.outputs.cache-hit != 'true'
        uses: android-actions/setup-android@v4
        with:
          packages: "ndk;26.1.10909125"

      - name: Set ANDROID_NDK_HOME
        if: contains(matrix.target, 'android') && steps.zvec-cache.outputs.cache-hit != 'true'
        shell: bash
        run: echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Patch zvec Android aligned allocation
        if: contains(matrix.target, 'android') && steps.zvec-cache.outputs.cache-hit != 'true'
        shell: bash
        run: bash scripts/patch-zvec-android.sh _zvec

      # Android needs host protoc first — use a separate source copy
      # so patches applied here don't conflict with the cross-compile build.
      # iOS is also a cross-compile and cannot use a target-built protoc.
      - name: Build host protoc
        if: (contains(matrix.target, 'android') || startsWith(matrix.target, 'aarch64-apple-ios')) && steps.zvec-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          cp -r _zvec _zvec-host
          cmake -S _zvec-host -B _zvec-host/build -G Ninja -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build _zvec-host/build --target protoc --parallel

      - name: Configure CMake
        if: steps.zvec-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          EXTRA="${{ matrix.cmake_extra }}"
          PROTOC_FLAG=""
          SDK_FLAG=""
          if [[ "${{ matrix.target }}" == *-linux-android ]] || [[ "${{ matrix.target }}" == aarch64-apple-ios* ]]; then
            PROTOC_FLAG="-DGLOBAL_CC_PROTOBUF_PROTOC=${{ github.workspace }}/_zvec-host/build/bin/protoc"
          fi
          # Device vs simulator differ only by which iOS SDK sysroot CMake
          # targets — this is what stamps the dylib's platform (device builds
          # cannot link into a simulator app and vice versa).
          if [ "${{ matrix.target }}" = "aarch64-apple-ios" ]; then
            SDK_FLAG="-DCMAKE_OSX_SYSROOT=$(xcrun --sdk iphoneos --show-sdk-path)"
          elif [ "${{ matrix.target }}" = "aarch64-apple-ios-sim" ]; then
            SDK_FLAG="-DCMAKE_OSX_SYSROOT=$(xcrun --sdk iphonesimulator --show-sdk-path)"
          fi
          cmake -S _zvec -B _zvec/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DBUILD_C_BINDINGS=ON \
            -DBUILD_PYTHON_BINDINGS=OFF \
            -DBUILD_TOOLS=OFF \
            $EXTRA $PROTOC_FLAG $SDK_FLAG

      - name: Build
        if: steps.zvec-cache.outputs.cache-hit != 'true'
        shell: bash
        run: cmake --build _zvec/build --parallel

      - name: Dump Arrow configure logs on failure
        if: failure()
        shell: bash
        run: |
          # Arrow builds via ExternalProject; its configure failures print
          # only "Command failed: 1" while the real error sits in stamp-dir
          # log files. Surface them so failures are diagnosable from CI.
          find _zvec/build* -path '*ARROW.BUILD-stamp*' -name '*.log' 2>/dev/null | while read -r f; do
            echo "===== $f ====="
            tail -120 "$f"
          done || true

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force staging
          Copy-Item "_zvec/build/bin/*.dll" staging/
          Copy-Item "_zvec/build/lib/*.lib" staging/
          $importLibrary = "_zvec/build/bin/zvec_c_api.lib"
          if (-not (Test-Path -LiteralPath $importLibrary)) {
            throw "zvec C API build did not produce $importLibrary"
          }
          Copy-Item $importLibrary staging/
          $env:ZVEC_LIB_DIR = (Resolve-Path staging)
          cargo build -p zvec --example basic --locked
          tar -czf "zvec_c_api-${{ matrix.target }}.tar.gz" -C staging .

      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p staging
          cp _zvec/build/lib/libzvec_c_api.dylib staging/
          tar -czf "zvec_c_api-${{ matrix.target }}.tar.gz" -C staging .

      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p staging
          cp _zvec/build/lib/libzvec_c_api.so staging/
          tar -czf "zvec_c_api-${{ matrix.target }}.tar.gz" -C staging .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: zvec_c_api-${{ matrix.target }}
          path: "zvec_c_api-${{ matrix.target }}.tar.gz"

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: zvec_c_api-*
          merge-multiple: true

      - name: Download header
        uses: actions/download-artifact@v8
        with:
          name: zvec-header
          path: _header

      - name: Compute all SHA256s
        id: checksums
        run: |
          for f in artifacts/zvec_c_api-*.tar.gz; do
            target=$(basename "$f" | sed 's/zvec_c_api-//;s/.tar.gz//')
            key=$(echo "$target" | tr '-' '_')
            hash=$(sha256sum "$f" | cut -d' ' -f1)
            echo "${key}=${hash}" >> "$GITHUB_OUTPUT"
          done

      - name: Update header
        run: cp _header/c_api.h include/zvec/c_api.h

      - name: Update build.rs checksums
        run: |
          sed -i \
            -e 's|("x86_64-unknown-linux-gnu", "[^"]*")|("x86_64-unknown-linux-gnu", "${{ steps.checksums.outputs.x86_64_unknown_linux_gnu }}")|' \
            -e 's|("aarch64-unknown-linux-gnu", "[^"]*")|("aarch64-unknown-linux-gnu", "${{ steps.checksums.outputs.aarch64_unknown_linux_gnu }}")|' \
            -e 's|("x86_64-apple-darwin", "[^"]*")|("x86_64-apple-darwin", "${{ steps.checksums.outputs.x86_64_apple_darwin }}")|' \
            -e 's|("aarch64-apple-darwin", "[^"]*")|("aarch64-apple-darwin", "${{ steps.checksums.outputs.aarch64_apple_darwin }}")|' \
            -e 's|("aarch64-apple-ios", "[^"]*")|("aarch64-apple-ios", "${{ steps.checksums.outputs.aarch64_apple_ios }}")|' \
            -e 's|("aarch64-apple-ios-sim", "[^"]*")|("aarch64-apple-ios-sim", "${{ steps.checksums.outputs.aarch64_apple_ios_sim }}")|' \
            -e 's|("x86_64-pc-windows-msvc", "[^"]*")|("x86_64-pc-windows-msvc", "${{ steps.checksums.outputs.x86_64_pc_windows_msvc }}")|' \
            -e 's|("aarch64-linux-android", "[^"]*")|("aarch64-linux-android", "${{ steps.checksums.outputs.aarch64_linux_android }}")|' \
            -e 's|("x86_64-linux-android", "[^"]*")|("x86_64-linux-android", "${{ steps.checksums.outputs.x86_64_linux_android }}")|' \
            build.rs

      # Guard: fail the release if any CHECKSUMS entry is still an empty
      # placeholder after the rewrite — catches a target added to the table
      # (and to the build matrix) but missing its sed line above, which would
      # otherwise ship an unbuildable target with an empty checksum.
      - name: Verify no empty checksums remain
        run: |
          if grep -nE '\("[^"]+", ""\)' build.rs; then
            echo "::error::A CHECKSUMS entry above still has an empty hash after the rewrite — add its sed line to 'Update build.rs checksums'." >&2
            exit 1
          fi

      - name: Bump version in Cargo.toml
        run: |
          sed -i "s/^version = \".*\"/version = \"${{ needs.prepare.outputs.version }}\"/" Cargo.toml
          cargo update -p zvec

      - name: Create release branch
        id: release-branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="release/v${{ needs.prepare.outputs.version }}"
          git switch -c "$BRANCH"
          git add build.rs include/zvec/c_api.h Cargo.toml Cargo.lock
          git commit -m "release: v${{ needs.prepare.outputs.version }} (zvec@${{ needs.prepare.outputs.zvec_sha }})"
          git push origin "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ needs.prepare.outputs.version }}
        run: |
          gh release create "$TAG" \
            --target "${{ steps.release-branch.outputs.branch }}" \
            --title "v${{ needs.prepare.outputs.version }} (zvec@${{ needs.prepare.outputs.zvec_sha }})" \
            --notes "Built from ${{ env.ZVEC_REPO }}@${{ needs.prepare.outputs.zvec_sha }}" \
            artifacts/zvec_c_api-*.tar.gz

      - name: Create PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --title "release: v${{ needs.prepare.outputs.version }} (zvec@${{ needs.prepare.outputs.zvec_sha }})" \
            --body "Built from ${{ env.ZVEC_REPO }}@${{ needs.prepare.outputs.zvec_sha }}. [Release](https://github.com/${{ github.repository }}/releases/tag/v${{ needs.prepare.outputs.version }})"
